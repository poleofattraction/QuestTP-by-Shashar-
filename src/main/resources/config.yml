  no-space: "&cНад цим блоком немає місця."
  already-departure: "&cУ тебе вже є точка відправки. Зламай стару (ЛКМ), щоб поставити нову."
  name-taken: "&cТочка інтересу з такою назвою вже стоїть у світі."
  placed-departure: "&aТочку відправки встановлено. ПКМ по ній відкриває меню."
  placed-interest: "&aТочку інтересу «{name}» встановлено."
