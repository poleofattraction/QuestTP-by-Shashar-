warmup-seconds: 3      # скільки секунд стояти нерухомо після вибору в меню
cooldown-seconds: 60   # затримка між телепортами для одного гравця

# Якщо плита "висить" над землею або втопилась у неї - підкрути це значення
# (0.5 - плита лежить рівно на блоці, невеликі кроки +-0.01).
display-y-offset: 0.5

# Для гравців Bedrock (через Geyser/Floodgate). У Bedrock немає ItemDisplay, тому плиту там
# не видно. Замість неї такий гравець бачить "підставний" блок. Він існує лише в його клієнті:
# на сервері його нема, тому ванільні якорі відродження не зачіпаються і активувати його не можна.
bedrock:
  enabled: true
  # Запасне розпізнавання Bedrock-гравців за префіксом ніка (основне: UUID від Floodgate)
  name-prefix: "."
  fake-blocks:
    interest: "minecraft:respawn_anchor[charges=4]"   # світиться
    departure: "minecraft:respawn_anchor[charges=0]"  # темний

item:
  # Предмет-основа. Вигляд йому задає item-model з ресурс-паку.
  # KNOWLEDGE_BOOK - непридатний у рецептах і нічого не робить сам по собі.
  base-material: KNOWLEDGE_BOOK

items:
  departure:
    name: "&bТочка відправки"
    lore:
      - "&7Постав на верхню грань блока."
      - "&7ПКМ по ній - меню з точками інтересу."
      - "&7Можна мати тільки одну поставлену."
    item-model: "questtp:departure_point"
  interest:
    name: "&dТочка інтересу: &f{name}"
    lore:
      - "&7Постав на верхню грань блока."
      - "&7ПКМ по ній - меню, щоб повернутись додому."
    item-model: "questtp:point_of_interest"

menu:
  departure-title: "&8Куди телепортуватись?"
  interest-title: "&8Повернутись"
  go-lore:
    - "&7Клікни, щоб телепортуватись."
  empty: "&cТочок інтересу поки немає"
  home-name: "&bДодому"
  home-lore:
    - "&7До твоєї точки відправки."
  no-home-name: "&cНемає точки відправки"
  no-home-lore:
    - "&7Спочатку поклади її у світ."

